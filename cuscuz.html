<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuscuz da Shaninha</title>
    <link rel="stylesheet" href="bom.css">
</head>
<body>
     <!--Logotipo-->
     <header>
        <div class="logotipo">
            <svg class="Logo-svg" viewBox=""0 0 100 100">
            <!-- Vapor do Cuscuz-->
             <path d="M 35 25 Q 30 15 35 5" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap=""round"/>
             <path d="M 50 25 Q 55 15 50 5" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap=""round"/>
             <path d="M 65 25 Q 60 15 65 5" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap=""round"/>
             <!--Cuscuzeira / Cuscuz-->
             <path d="M 20 75 L 30 35 L 70 35 L 80 75 Z" fill="#d97706"/>
             <rect x="15" y="75" width="70" height="8" rx="3" fill="#b45309"/>"
            </svg>
            <h1>Cuscuz da Shaninha</h1>
            <p>O autêntico sabor de Caicó</p>
        </div>
     </header>

     <section class="instrucoes">
        <h2>Como funciona o seu pedido?</h2>
        <p>Monte o cuscuz do seu jeito! Escolha obrigatoriamente <strong>1 tipo de massa base</strong> e adicione quantos recheios, coberturas e acompanhamentos desejar para criar a combinação perfeita.</p>
     </section>

     <!--Formulário do Menu-->
     <main class="container">
        <form id="cuscuzform">

            <section class="calabresa">
                <h3 class="tomate">1. Escolha a sua Massa (obrigatório)</h3>
                <div class="coentro">
                    <label class="ovo">
                        <div class="codorna">
                          <span class="queijo"><input type="radio" name="massa" value="6.00" data-name="Massa Tradicional" required checked> Tradicional</span>
                          <span class="mussarela">R$ 6,00</span>
                        </div>
                    </label>
                    <label class="ovo">
                        <div class="codorna">
                            <span class="queijo"><input type="radio" name="massa" value="7.00" data-name="Massa de Leite"> Temperada no Leite</span>
                            <span class="mussarela">R$ 7,00</span>
                        </div>
                    </label>
                </div>
            </section>
        </form>
     </main>
</body>
</html>
